<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>涛哥 BGM 下载站</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; color: #333; }
  .container { max-width: 900px; margin: 0 auto; background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.3); overflow: hidden; }
  .header { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); padding: 40px; color: #fff; text-align: center; }
  h1 { font-size: 32px; margin-bottom: 10px; }
  .subtitle { opacity: .9; font-size: 14px; }
  .search-bar { padding: 30px 40px; display: flex; gap: 10px; border-bottom: 1px solid #eee; }
  input { flex: 1; padding: 16px 22px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; transition: border .2s; }
  input:focus { outline: none; border-color: #667eea; }
  button { padding: 16px 32px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: 600; }
  button:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102,126,234,.4); }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .results { padding: 20px 40px 40px; }
  .status { text-align: center; color: #888; padding: 30px; font-size: 15px; }
  .empty { text-align: center; color: #999; padding: 60px 20px; }
  .result { padding: 18px; border: 1px solid #e8e8e8; border-radius: 10px; margin-bottom: 12px; display: flex; align-items: center; gap: 16px; transition: all .2s; background: #fafafa; }
  .result:hover { border-color: #667eea; box-shadow: 0 4px 12px rgba(0,0,0,.06); background: #fff; }
  .info { flex: 1; min-width: 0; }
  .song-name { font-weight: 600; font-size: 17px; margin-bottom: 6px; color: #2d3748; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: #888; font-size: 13px; }
  .source-tag { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; margin-right: 8px; font-weight: 500; }
  .tag-netease { background: #fee; color: #c33; }
  .tag-qq { background: #e6f7ff; color: #1890ff; }
  .tag-migu { background: #f6ffed; color: #52c41a; }
  .download-btn { padding: 10px 20px; background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; text-decoration: none; display: inline-block; }
  .download-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(67,233,123,.4); }
  .footer { text-align: center; padding: 20px; color: #999; font-size: 13px; background: #f9f9f9; }
  .footer a { color: #667eea; text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎵 涛哥 BGM 下载站</h1>
    <div class="subtitle">搜歌 → 点链接 → 直接下载 MP3/FLAC（网易云 / QQ / 咪咕）</div>
  </div>
  <div class="search-bar">
    <input id="q" placeholder="输入歌名，例如：精卫 / 二拜天地 / FAKE LOVE" autofocus>
    <button onclick="search()">搜索</button>
  </div>
  <div class="results" id="results">
    <div class="empty">输入歌名开始搜索 👆</div>
  </div>
  <div class="footer">
    Powered by musicdl · 后端跑在新加坡 VPS · 任何地方可访问
  </div>
</div>

<script>
// Cloudflare Tunnel 地址
const API_BASE = 'https://screen-camp-turtle-stored.trycloudflare.com';

async function search() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const btn = document.querySelector('button');
  btn.disabled = true; btn.textContent = '搜索中...';
  document.getElementById('results').innerHTML = '<div class="status">🔍 正在搜索：' + q + ' ...</div>';
  try {
    const resp = await fetch(API_BASE + '/search?q=' + encodeURIComponent(q));
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    renderResults(data.results, q);
  } catch (e) {
    document.getElementById('results').innerHTML = '<div class="status">❌ 搜索失败：' + e.message + '</div>';
  }
  btn.disabled = false; btn.textContent = '搜索';
}

function renderResults(results, q) {
  const div = document.getElementById('results');
  if (!results || results.length === 0) {
    div.innerHTML = '<div class="empty">没找到「' + q + '」相关歌曲，换个关键词试试</div>';
    return;
  }
  let html = '<div class="status">找到 <b>' + results.length + '</b> 个结果，点击直接下载</div>';
  results.forEach((r, i) => {
    const tagClass = 'tag-' + r.source.toLowerCase();
    const safeName = (r.song_name + ' - ' + r.singers).replace(/[<>"']/g, '');
    html += `
      <div class="result">
        <div class="info">
          <div class="song-name">${r.song_name}</div>
          <div class="meta">
            <span class="source-tag ${tagClass}">${r.source}</span>
            ${r.singers} · ${r.duration || ''}
          </div>
        </div>
        <a class="download-btn" href="${r.download_url}" download target="_blank" rel="noopener">⬇ 下载</a>
      </div>
    `;
  });
  div.innerHTML = html;
}

document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') search();
});
</script>
</body>
</html>
